<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <title>LGL Vibecoding</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="gate" id="gate" hidden>
    <div class="gate-card">
      <h1 class="gate-title">LGL Vibecoding</h1>
      <p class="gate-sub">For the crew. What's the word?</p>
      <form class="gate-form" id="gate-form" autocomplete="off">
        <input class="gate-input" id="gate-input" type="password" aria-label="Password" />
        <button class="gate-submit" type="submit">Enter</button>
      </form>
      <p class="gate-error" id="gate-error" hidden>Nope.</p>
    </div>
  </div>

  <div class="shell" id="shell" hidden>
    <header class="page-head">
      <div>
        <h1>LGL Vibecoding</h1>
        <p class="sub" id="subtitle"></p>
      </div>
      <div class="head-right">
        <span id="updated"></span>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle theme">Dark</button>
      </div>
    </header>

    <section class="mascots" aria-label="Crew mascots">
      <img class="mascot" src="images/mascot-1.png" alt="LGL crew mascot" loading="lazy" />
      <img class="mascot" src="images/mascot-2.png" alt="Aquarium crew mascot" loading="lazy" />
    </section>

    <div class="filter-bar" id="filters"></div>
    <main class="grid" id="grid"></main>

    <footer>
      <span>Built at lunch. Add new ones by editing <code>app.js</code> (DATA.sites array).</span>
      <span>Old Little Giant marketing crew, still building.</span>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
